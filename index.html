    <!-- Google Fonts. Only the weights actually rendered are requested:
         JetBrains Mono 400 (all body text) and 700 (the project cards' names
         and their VIEW buttons); Space Mono 700, used by the Scene 2 row's two
         words (SYSTEM and PROJECTS) and by nothing else; plus Space Grotesk
         400, kept because --font-display still points at it. The 300/500/600/800
         weights were dropped. Anything set to a weight that is not requested
         here will synthesize. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
