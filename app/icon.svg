<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab logo: three rising strokes on the site's night (#111), split on the
       diagonal into its sky blue (#0690d4) and a dark silver. No letters. -->
  <defs>
    <linearGradient id="split" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3bb4f2"/>
      <stop offset="0.5" stop-color="#0690d4"/>
      <stop offset="0.5" stop-color="#b9bec6"/>
      <stop offset="1" stop-color="#6b717a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#111111"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <path d="M7 25l3.2-8M13 25l5.2-13M19 25l7.2-18" fill="none" stroke="url(#split)" stroke-width="3.4" stroke-linecap="round"/>
</svg>
