<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon: the site's sky blue (#0690d4) with a silver "A" (the intro's
       #e8e8ec shading to a cool grey). Drawn as strokes, so it needs no font. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2cb0f2"/>
      <stop offset="0.5" stop-color="#0690d4"/>
      <stop offset="1" stop-color="#045f91"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="8" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8e8ec"/>
      <stop offset="1" stop-color="#a7acb6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#sky)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <path d="M9 24 16 8l7 16M11.8 18.6h8.4" fill="none" stroke="url(#silver)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
