<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tab logo: three arcs spiralling out of the centre, 120° apart, each
       running from sky blue (#0690d4) into dark silver. Transparent, no
       letters. Parameters in CLAUDE.md (Favicon). -->
  <defs>
    <linearGradient id="g" x1="32.00" y1="27.00" x2="55.38" y2="45.50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0690d4"/>
      <stop offset="0.45" stop-color="#35a8e6"/>
      <stop offset="0.7" stop-color="#c6cad1"/>
      <stop offset="1" stop-color="#7a818b"/>
    </linearGradient>
    <path id="a" d="M32.00 27.00A16.0 16.0 0 0 1 55.38 45.50" fill="none" stroke="url(#g)" stroke-width="6.2" stroke-linecap="round"/>
  </defs>
  <g transform="translate(-2.96 1.96) scale(1.0807)">
    <use href="#a"/>
    <use href="#a" transform="rotate(120 32 32)"/>
    <use href="#a" transform="rotate(240 32 32)"/>
  </g>
</svg>
